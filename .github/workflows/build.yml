name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: |
          ./gradlew build --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Report build errors
        if: failure()
        run: |
          msg=$(grep -E -A8 "error:|What went wrong|FAILED|Caused by" build.log | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=BuildErrors::$msg"

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: heartbound-fabric
          path: fabric/build/libs/*.jar

      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v4
        with:
          name: heartbound-neoforge
          path: neoforge/build/libs/*.jar
